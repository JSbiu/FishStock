name: 问题反馈
description: 报告可以重复的错误、兼容性或行情异常
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请勿提交访问令牌、账号、文件路径或其他敏感信息。
  - type: input
    id: version
    attributes:
      label: FishStock 版本
      placeholder: 例如 0.5.1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: VS Code 与操作系统
      placeholder: 例如 VS Code 1.100 / Windows 11 x64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 重现步骤
      description: 请按发生顺序描述最少步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 脱敏诊断信息或日志
      description: 可执行“FishStock: 复制运行诊断信息”；输出日志粘贴前请自行复核敏感内容。
      render: text
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 可拖入经过遮挡处理的截图。
