name: 功能建议
description: 描述使用场景、问题和希望达到的结果
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 目前在什么情况下遇到了什么问题？
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 希望达到的结果
      description: 请描述结果，不必预先设计实现方式。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 目前的替代办法
      description: 如果已经有临时解决办法，可以补充说明。
